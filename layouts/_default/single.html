{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
  <div class="post">{{ .Content }}</div>
  {{ with .GetTerms "constraints" }}<p>More puzzles with: {{ range . }}<a class="constraint" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</p>{{ end }}
</article>
{{ end }}
