<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
    <link rel="stylesheet" href="/style.css">
    {{ with .OutputFormats.Get "RSS" }}
    <link rel="alternate" type="application/rss+xml" title="{{ $.Title }} RSS" href="{{ .RelPermalink }}">
    {{ else }}
    {{ with site.Home.OutputFormats.Get "RSS" }}
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }} RSS" href="{{ .RelPermalink }}">
    {{ end }}
    {{ end }}
  </head>
  <body>
    <header><a href="/">{{ site.Title }}</a> <a href="/tags/">Constraints</a> <a href="{{ (site.Home.OutputFormats.Get "RSS").RelPermalink }}">RSS</a></header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer>Explore sudoku puzzles and their video walkthroughs.</footer>
  </body>
</html>
