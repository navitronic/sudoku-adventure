name: Append puzzles

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: append-puzzles
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import new puzzles
        run: python3 scripts/import_puzzles.py append
      - name: Commit and push new posts
        run: |
          git add -- content/puzzles
          if git diff --cached --quiet; then
            echo "No new puzzles"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Append new puzzles"
          git push
